<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书签同步</title>
    <link rel="stylesheet" href="./popup.css" />
    <link rel="stylesheet" href="./layout.css" />
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3-5 3Z" /></svg></div>
        <div class="hero-text">
          <h1>书签同步</h1>
        </div>
        <button id="optionsBtn" class="setting-btn icon-btn hero-settings" aria-label="打开设置" title="打开设置">
          <span class="visually-hidden">打开设置</span>
          <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9.8 3h4.4l.6 2.5 1.4.8 2.5-.7 2.2 3.8-1.9 1.8v1.6l1.9 1.8-2.2 3.8-2.5-.7-1.4.8-.6 2.5H9.8l-.6-2.5-1.4-.8-2.5.7-2.2-3.8L5 12.8v-1.6L3.1 9.4l2.2-3.8 2.5.7 1.4-.8Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <div class="collection-heading"><span>我的书签</span><span class="collection-label">本地收藏</span></div>
      <div id="countRefreshIndicator" class="count-refresh hidden" aria-live="polite">
        <span class="count-refresh-spinner" aria-hidden="true"></span>
        <span>正在刷新数量...</span>
      </div>
      <section id="counts" class="counts" aria-label="书签数量"></section>

      <div class="status-strip">
        <span id="syncDot" class="sync-dot" data-state="idle" title="同步状态"></span>
        <p id="lastSync" class="last-text">尚未同步</p>
      </div>

      <section id="connectPanel" class="connect-panel hidden">
        <div class="connect-copy">
          <span class="cloud-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 1 1 0-10 6 6 0 0 1 11 1 4.5 4.5 0 0 1 0 9M12 12v8m-3-5 3-3 3 3" /></svg></span>
          <div><h2>让书签随你同行</h2><p>连接仓库，在不同设备间同步。</p></div>
        </div>
        <button id="connectBtn" class="connect-btn" type="button">连接云端仓库 <span aria-hidden="true">→</span></button>
        <div class="provider-caption">支持 GitHub · Gitee · Gist</div>
      </section>

      <section id="syncPanel" class="section">
        <div class="actions">
          <div class="action-item">
            <button id="pushBtn" class="main big"><span class="action-arrow" aria-hidden="true">↑</span>推送到云端</button>
            <p id="pushTargetHint" class="target-hint-line"></p>
          </div>
          <div class="action-item">
            <button id="pullBtn" class="danger big"><span class="action-arrow" aria-hidden="true">↓</span>拉取到本地</button>
            <p id="pullTargetHint" class="target-hint-line"></p>
          </div>
        </div>
        <p class="pull-warning">拉取将覆盖本地书签</p>

        <details id="advanced" class="advanced">
          <summary>高级选项</summary>
          <label class="provider-field">
            默认平台
            <select id="defaultProvider"></select>
          </label>
          <label class="chk-option">
            <input id="pushAllChk" type="checkbox" />
            推送到全部已配置平台
          </label>
          <p class="advanced-hint">自动同步也会使用该推送目标。</p>
          <a id="historyLink" class="history-link hidden" target="_blank" rel="noopener">查看云端历史</a>
        </details>
      </section>

      <pre id="conflictPreview" class="conflict hidden"></pre>
      <p id="status" class="status hidden"></p>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
